# Nginx: load balancer + lớp bảo vệ đầu tiên trước các container agent.
#
# `deploy.replicas` / `--scale agent=N` tạo N container cùng tên service
# `agent`. Docker DNS (127.0.0.11) trả về IP của cả N container; `resolve`
# khiến nginx hỏi lại DNS định kỳ, nên container restart/scale đổi IP vẫn
# được cập nhật mà không phải reload nginx.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;

    # Traffic từ Cloudflare Tunnel đi vào qua container cloudflared, nên
    # $remote_addr luôn là IP nội bộ của nó. IP thật của client nằm trong
    # header CF-Connecting-IP — chỉ tin header này khi đến từ mạng Docker.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;

    # cloudflared gửi X-Forwarded-Proto: https; gọi thẳng localhost thì dùng scheme thật
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Chặn flood theo IP trước khi request chạm tới app (app còn có rate
    # limit theo user ở Redis — hai lớp này bổ sung cho nhau).
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_status 429;

    log_format json escape=json
        '{"event":"nginx_access","time":"$time_iso8601","request_id":"$request_id",'
        '"client_ip":"$remote_addr","method":"$request_method","path":"$uri",'
        '"status":$status,"duration_s":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;

    upstream agent_backend {
        zone agent_backend 64k;
        server agent:8000 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        client_max_body_size 16k;

        # Chỉ thử instance khác khi instance này lỗi kết nối hoặc đang tắt
        # (503). POST không được thử lại (mặc định) → không tính tiền 2 lần.
        proxy_next_upstream error timeout http_502 http_503;

        location / {
            limit_req zone=per_ip burst=20 nodelay;

            proxy_pass http://agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60s;
        }
    }
}
