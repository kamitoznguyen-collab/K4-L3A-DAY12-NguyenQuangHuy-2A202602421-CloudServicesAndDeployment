# CI/CD: mỗi push / pull request đều được lint, test và build trên máy sạch.
# Chỉ push lên main mới release image — và chỉ khi test + build đều xanh.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      # Redis thật cho tests/integration — fakeredis không bắt được mọi khác biệt
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      # test_cp5 gọi vào bản deploy đang sống, test_bonus_cicd kiểm tra badge của
      # chính workflow này — cả hai không thuộc về CI. Test cần Docker chạy ở job build.
      - name: Unit + integration tests
        env:
          REDIS_TEST_URL: redis://localhost:6379/15
        run: >-
          pytest tests/ -m "not docker"
          --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py
          --cov --cov-report=term --cov-fail-under=95

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build image
        run: |
          docker build -t day12-agent:ci .
          docker images day12-agent:ci --format "Image size: {{.Size}}"

      # Build thật, non-root, fail fast khi thiếu key, SIGTERM thoát mã 0
      - name: Docker tests
        run: pytest tests/test_cp2.py tests/unit -m docker -v

      - name: Start full stack (redis + 2 agent + nginx)
        run: |
          key=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$key"
          echo "AGENT_API_KEY=$key" >> "$GITHUB_ENV"
          echo "SMOKE_API_KEY=$key" >> "$GITHUB_ENV"
          AGENT_API_KEY=$key docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke test through nginx
        run: python scripts/smoke_test.py http://localhost:8000

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

  deploy:
    # Cổng chất lượng: chỉ chạy khi test VÀ build đều xanh, và chỉ từ main
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Release image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Kiểm tra bản đang public nếu đã cấu hình (Settings → Variables: PUBLIC_URL,
      # Settings → Secrets: DEPLOY_API_KEY). Quick Tunnel đổi URL khi restart nên
      # bước này tự bỏ qua khi chưa đặt biến.
      - name: Smoke test public URL
        if: vars.PUBLIC_URL != ''
        env:
          SMOKE_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: |
          pip install httpx python-dotenv
          python scripts/smoke_test.py "${{ vars.PUBLIC_URL }}"
