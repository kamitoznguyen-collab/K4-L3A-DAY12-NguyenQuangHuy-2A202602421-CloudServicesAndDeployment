# ═══════════════════════════════════════════════════════════════════
# Stack đầy đủ:
#
#   Internet ─HTTPS─► Cloudflare ─► cloudflared ─► nginx ─► agent ×N ─► redis
#                                   (profile public)  :8000 trên máy bạn
#
#   docker compose up -d --build                    # chạy local: http://localhost:${HOST_PORT:-8000}
#   docker compose --profile public up -d --build   # + public HTTPS qua Cloudflare Tunnel
#   python scripts/public_url.py                    # in URL công khai
#
# Secret đọc từ file .env (không commit) qua nội suy ${...}.
# ═══════════════════════════════════════════════════════════════════

name: day12

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Chỉ mở cho máy bạn (để chạy app ngoài Docker khi dev), không mở ra LAN
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  agent:
    build: .
    image: day12-agent:local
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:?Chưa set AGENT_API_KEY trong .env}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: "8000"
    # Không publish cổng: mọi traffic đi qua nginx, nên scale được nhiều bản
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    # Thời gian cho request đang chạy dở xử lý xong trước khi bị SIGKILL
    stop_grace_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # HOST_PORT trong .env nếu 8000 trên máy bạn đã bị chiếm
    ports:
      - "${HOST_PORT:-8000}:80"
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Cloudflare Quick Tunnel: không cần tài khoản, tự cấp https://<random>.trycloudflare.com.
  # Metrics server có endpoint /quicktunnel trả về hostname → scripts/public_url.py đọc nó.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["public"]
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - --url
      - http://nginx:80
    ports:
      - "127.0.0.1:2000:2000"
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
